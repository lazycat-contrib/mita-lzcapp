package: community.lazycat.app.mita
version: 3.40.1
name: mita
description: "Mieru server (mita): a censorship-resistant socks5 / HTTP / HTTPS proxy with traffic obfuscation. Deploy your own proxy server on LazyCat and connect from mieru clients on desktop and mobile."
min_os_version: 1.5.0
author: enfein
license: GPL-3.0
homepage: https://github.com/enfein/mieru

permissions:
  required:
    - net.internet

locales:
  zh:
    name: "mita"
    description: "无流量特征、难以主动探测的 socks5 / HTTP / HTTPS 代理服务器（mieru 服务端）。部署在懒猫微服上，桌面与手机上的 mieru / Clash 系客户端即可安全连回家中网络。"
  en:
    name: "mita"
    description: "Mieru server (mita): a censorship-resistant socks5 / HTTP / HTTPS proxy with traffic obfuscation. Deploy your own proxy server on LazyCat and connect from mieru clients on desktop and mobile."

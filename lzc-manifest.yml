application:
  subdomain: mita
  background_task: true
  public_path:
    - /
  # 纯代理服务无 Web UI：入口页由 setup_script 用 Go 工具渲染到持久目录
  # （含服务器地址、端口、用户名、密码、流量种子），每次启动随配置更新
  upstreams:
    - location: /
      backend: file:///lzcapp/var/mita/web/
  # ingress 不支持部署参数模板：固定 28999 双栈（TCP+UDP），server.json 端口绑定与之对应
  ingress:
    - protocol: tcp
      port: 28999
      service: mita
      description: "mieru proxy (TCP)"
    - protocol: udp
      port: 28999
      service: mita
      description: "mieru proxy (UDP)"
services:
  mita:
    # ghcr.io/enfein/mita:v3.40.0@sha256:3e3a7685c15d2224e48dbe6bc616c4e65f7c10653242561bfc70a25ea7010e1b (upstream official image)
    image: ghcr.1ms.run/enfein/mita:v3.40.0@sha256:3e3a7685c15d2224e48dbe6bc616c4e65f7c10653242561bfc70a25ea7010e1b
    environment:
      - MITA_UDS_PATH=/var/run/mita/mita.sock
      - TZ=Asia/Shanghai
    # setup_script 与 entrypoint/command 互斥（spec）：setup 以 root 执行完后，
    # 由镜像原生 CMD（mita run 前台）接管成为主进程
    setup_script: |
      # 每次容器启动都会执行：准备好目录；首次启动时短暂拉起 daemon 应用一次配置，
      # 应用成功后停掉临时 daemon 退出，随后镜像原生 `mita run` 以正式进程启动并加载已保存配置。
      mkdir -p /lzcapp/var/mita /lzcapp/var/mita/etc /var/run/mita
      chmod 777 /var/run/mita
      # $random 会生成字母数字混合串，seed 必须是整数：过滤掉字母后再写入 JSON
      if [ ! -f /lzcapp/var/mita/server.json ]; then
        SEED="{{ .U.traffic_seed }}"
        DIGITS="$(printf '%s' "$SEED" | tr -dc '0-9')"
        while [ ${#DIGITS} -lt 6 ]; do
          DIGITS="${DIGITS}$(( $(date +%s%N) % 10 ))"
        done
        printf '{"portBindings":[{"port":28999,"protocol":"TCP"},{"port":28999,"protocol":"UDP"}],"users":[{"name":"{{ .U.proxy_username }}","password":"{{ .U.proxy_password }}"}],"loggingLevel":"INFO","dns":{"dualStack":"PREFER_IPv4"},"trafficPattern":{"seed":%s,"unlockAll":false}}\n' "$DIGITS" > /lzcapp/var/mita/server.json
      fi
      # 渲染连接说明页（Go 工具按架构选择，读取实际 server.json 生成，
      # 含用户名 / 密码 / 种子 / 端口），每次启动重新渲染以保持与配置一致
      mkdir -p /lzcapp/var/mita/bin /lzcapp/var/mita/web
      case "$(uname -m)" in
        aarch64|arm64) RP=/lzcapp/pkg/content/renderpage-arm64 ;;
        *)             RP=/lzcapp/pkg/content/renderpage-amd64 ;;
      esac
      if [ -x "$RP" ]; then
        cp "$RP" /lzcapp/var/mita/bin/renderpage && chmod +x /lzcapp/var/mita/bin/renderpage
        /lzcapp/var/mita/bin/renderpage /lzcapp/var/mita/server.json /lzcapp/var/mita/web/index.html
      fi
      if ! mita describe config 2>/dev/null | grep -q portBindings; then
        echo "[setup] applying initial server config"
        mita run >/dev/null 2>&1 &
        MITA_PID=$!
        i=0
        while [ $i -lt 40 ]; do
          [ -S /var/run/mita/mita.sock ] && break
          i=$((i+1)); sleep 0.5
        done
        mita apply config /lzcapp/var/mita/server.json && mita start
        mita stop >/dev/null 2>&1 || true
        kill $MITA_PID >/dev/null 2>&1 || true
        wait $MITA_PID 2>/dev/null || true
      fi
    binds:
      - /lzcapp/var/mita:/lzcapp/var/mita
      - /lzcapp/var/mita/etc:/etc/mita
    healthcheck:
      test:
        - CMD
        - mita
        - status
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
usage: |
  mita 是 mieru【見える】代理体系的服务端（部署在懒猫这台机器上）；
  客户端用 mieru / Clash 系软件连接本应用后，即可通过家中网络安全上网。

  连接信息（客户端填写）：
  - 地址：懒猫主机的公网可达地址（外网访问用公网 IP / 域名 + 路由器端口转发，
    局域网内直接用懒猫内网 IP）
  - 端口：部署时设置的「代理端口」（默认 28999，懒猫已自动映射）
  - 协议：TCP（若部署时启用了 UDP，也可选 UDP）
  - 用户名 / 密码：部署时设置的「代理用户名」「代理密码」
    （密钥由用户名+密码+系统时间推导，客户端与服务器时间需基本一致）
  - 流量特征种子（trafficPattern.seed）：部署时设置的「流量特征种子」。
    客户端 profile 里必须填写同一个数字，否则无法建立会话。

  客户端推荐：
  - 桌面：mieru 官方客户端、Clash Verge Rev、Mihomo Party
  - 安卓：ClashMetaForAndroid、ClashMi、husi + mieru plugin
  - iOS：Karing、ClashMi
  - 客户端传输协议选 mieru，填以上四项即可。

  说明：
  - 本应用是纯代理服务，没有 Web 管理界面；应用入口页展示连接说明。
  - 修改用户/端口：进入应用终端运行 `mita apply config /lzcapp/var/mita/server.json`
    （先编辑该 JSON 文件），再 `mita reload` 即可，无需重启应用。
  - 代理端口经懒猫入站转发，外部看到的端口与设置值一致；如需从公网访问，
    请在路由器上把该端口转发到懒猫主机。

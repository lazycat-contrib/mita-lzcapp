params:
  - id: proxy_username
    type: string
    name: "Proxy Username"
    description: "Username for the first mieru proxy user (max 64 bytes)."
    default_value: "lazycat"
    optional: false

  - id: proxy_password
    type: secret
    name: "Proxy Password"
    description: "Password for the proxy user (max 64 bytes). Keys are derived from username+password+time on both ends, so keep clients configured identically."
    default_value: "$random(len=20)"
    optional: false

  - id: traffic_seed
    type: string
    name: "Traffic Pattern Seed"
    description: "Digits-only integer seed for the obfuscation traffic pattern. MUST match the seed set in client profiles, otherwise sessions cannot be established."
    default_value: "$random(len=9)"
    optional: false

locales:
  zh:
    proxy_username:
      name: "代理用户名"
      description: "第一个 mieru 代理用户的用户名（最长 64 字节）。"
    proxy_password:
      name: "代理密码"
      description: "代理用户密码（最长 64 字节）。密钥由用户名+密码+时间在两端共同推导，请保持客户端配置一致。"
    traffic_seed:
      name: "流量特征种子"
      description: "混淆流量特征的纯数字整数种子。客户端配置里必须填写同一个种子，否则无法建立会话。"
